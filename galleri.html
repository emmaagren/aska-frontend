<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Galleri – ASKA</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <header class="hero hero-small">
        <nav class="main-nav">
            <a href="index.html" class="logo">Restaurang ASKA</a>
            <ul class="nav-links">
                <li><a href="index.html">Hem</a></li>
                <li><a href="om-oss.html">Om oss</a></li>
                <li><a href="meny.html">Meny</a></li>
                <li><a href="galleri.html">Bilder</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
            <button class="menu-toggle" aria-label="Öppna meny">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>

        <div class="hero-text">
            <h2>Bildgalleri</h2>
            <p class="typewriter">Här kan du se lite mer av oss.</p>
        </div>
    </header>

    <main>

        <section class="gallery-grid">
            <img src="images/hjort2025.jpg" alt="Närbild på maträtt med hjortfilé.">
            <img src="images/roding2025.jpg" alt="Närbild på maträtt med fjällröding">
            <img src="images/hjortron.jpg" alt="Skål med vaniljglass och hjortronsylt">
            <img src="images/granskottsglass.jpg" alt="Vit tallrik med granskottsglass">
            <img src="images/grönkål.jpg" alt="Skål med färgstark grönkålssallad">
            <img src="images/ljus.jpg" alt="Interiörsbild från restaurangen med menyer och ljus på en bänk.">

        </section>

    </main>

    <footer>
        <p>© Restaurang ASKA</p>
        <p><a href="admin.html">Personalinloggning</a></p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');

            toggle.addEventListener('click', () => {
                navLinks.classList.toggle('open');
            });
        });
    </script>

</body>

</html>
